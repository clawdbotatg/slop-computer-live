# coturn config for slop-computer-live
#
# Auth model: HMAC shared-secret (rfc5766-turn-server / time-bounded creds).
# Clients fetch ephemeral {username, password} pairs from the relay, which
# computes the password as base64(HMAC-SHA1(secret, username)). Username
# is "<expiry-unix>:<id>" and the relay sets expiry ~1h ahead of issue.

# Network — listen on all interfaces, both UDP and TCP.
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# IMPORTANT: replace with the EC2 public elastic IP. The default
# external-ip auto-detection often picks the private IP on AWS, which
# breaks NAT relay — every client would dial 172.x and time out.
external-ip=98.82.26.233/172.31.2.161

# Relay UDP port range. Keep this narrow so AWS SG rules stay manageable.
min-port=49160
max-port=49200

# HMAC auth — the relay shares this same secret in its env.
use-auth-secret
static-auth-secret=__TURN_SHARED_SECRET__

# Realm just identifies the server in long-term creds (cosmetic for HMAC).
realm=slop.computer

# Don't allow loopback / private IPs as relay peers — denies amplification
# attacks if some client tries to abuse the server.
no-loopback-peers
no-multicast-peers

# Reject CLI mgmt port — we don't use it.
no-cli

# Don't bother with TLS certs for v1; clients can still use STUN/TURN over UDP.
no-tls
no-dtls

# Quiet down — only log warnings/errors. journald will capture stderr.
verbose=0
no-stdout-log
syslog
