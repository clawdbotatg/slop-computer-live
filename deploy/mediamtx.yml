# MediaMTX config for slop.computer
# RTMP ingest on :1935, HLS output on :8888, no auth on read.
# Publishing requires the host to know the stream key (set in path config below).

logLevel: info
logDestinations: [stdout]

api: no
metrics: no
playback: no
pprof: no

# Plain RTMP ingest (host pushes here)
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# HLS read (Caddy proxies media.slop.computer/hls/* here)
hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"
hlsEncryption: no
hlsAlwaysRemux: yes
# mpegts = traditional HLS with TS segments and audio+video muxed in a
# single playlist. Plays in every player including Chrome's native <video>
# tag when loaded directly. fmp4 was structurally correct but mediamtx
# emits it as a master with a separate #EXT-X-MEDIA AUDIO group pointing
# to its own playlist (audio2_stream.m3u8) — Chrome's native HLS chokes
# on that combination and shows an empty player with no error event. ts
# avoids the audio-group entirely. Latency ~8s (same as fmp4); ~5% larger
# segments. LL-HLS (`lowLatency`) was tried first and broke every
# non-LL-aware player because of EXT-X-PART/SERVER-CONTROL/PRELOAD-HINT.
hlsVariant: mpegts
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsSegmentMaxSize: 50M

# Disable other protocols we don't need
rtsp: no
srt: no
webrtc: no

# Path rules: single static path "live" — host publishes via RTMP with
# basic-auth credentials, anyone can read the HLS output. The relay shares
# these same creds in its env so it can hand them to /admin/start callers.
authMethod: internal
authInternalUsers:
  - user: live
    pass: __MEDIAMTX_PUBLISH_PASS__
    ips: []
    permissions:
      - action: publish
        path: live
  - user: any
    pass: ""
    ips: []
    permissions:
      - action: read
      - action: playback
      - action: api
      - action: metrics

paths:
  live:
    source: publisher
    sourceOnDemand: no
    # Persist every live session to disk so it can be uploaded to IPFS after
    # the show. Files land at /home/ubuntu/recordings/live/<timestamp>.mp4
    # (fragmented MP4 — browser-playable, remuxable in seconds with
    # `ffmpeg -c copy`). The relay's /admin/finalize endpoint scans this dir.
    record: yes
    recordPath: /home/ubuntu/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 24h
    recordDeleteAfter: 0s
